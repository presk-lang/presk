[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/presk-lang/presk"

[workspace.dependencies]
presk-syntax = { path = "crates/presk-syntax", version = "=0.6.0" }
presk-types = { path = "crates/presk-types", version = "=0.6.0" }
presk-core = { path = "crates/presk-core", version = "=0.6.0" }
presk-interp = { path = "crates/presk-interp", version = "=0.6.0" }
presk-data = { path = "crates/presk-data", version = "=0.6.0" }
presk-train = { path = "crates/presk-train", version = "=0.6.0" }
presk-rt = { path = "crates/presk-rt", version = "=0.6.0" }
presk-kernel = { path = "crates/presk-kernel", version = "=0.6.0" }
presk-sched = { path = "crates/presk-sched", version = "=0.6.0" }
presk-cranelift = { path = "crates/presk-cranelift", version = "=0.6.0" }
presk-serve = { path = "crates/presk-serve", version = "=0.6.0" }
presk-export-pytorch = { path = "crates/presk-export-pytorch", version = "=0.6.0" }
presk-opt = { path = "crates/presk-opt", version = "=0.6.0" }
presk-precision = { path = "crates/presk-precision", version = "=0.6.0" }
clap = { version = "4", features = ["derive"] }
ariadne = "0.5"
indexmap = "2"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
proptest = "1"
rug = { version = "1", default-features = false, features = ["integer", "float", "std"] }
rand_chacha = "0.9"
rand_core = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
insta = { version = "1", features = ["glob"] }
egg = "0.11"

[profile.dev]
opt-level = 1
