# Build and test on every push to main and on every pull request, on Linux
# x86-64 and macOS arm64. The first build compiles GMP and MPFR from their
# sources (the `rug` crate), which needs m4 and a C compiler: GitHub's
# runners have the compiler, Ubuntu's lacks m4. Nothing here is a
# measurement: the timings of record are taken by hand on a quiet machine
# (the manual's `experiments` chapter), never in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # Two tests of the CLI plan under the frozen layout model of the
      # measurement machine (`~/presk-data/ra4-model-0.8.0/profile.json`);
      # `RA4_FROZEN` names another copy, here the one the explain tests
      # carry, the same model without its calibration samples.
      RA4_FROZEN: ${{ github.workspace }}/crates/presk-explain/tests/data/x925-frozen.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: m4, for GMP's build
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y m4
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: The example programs
        run: make check-examples
      # Apple's clang has no OpenMP, so on macOS the tests above build every
      # exported program without it (D212). Homebrew's GCC has it: the C
      # export's tests run again under the runner's newest GCC, every program
      # built both ways and run on a team, contraction in GCC's GNU mode
      # (D213).
      - name: The C export's tests under GCC, with OpenMP
        if: runner.os == 'macOS'
        run: |
          newest() { ls "$(brew --prefix)/bin" | sed -n -E '/^gcc-[0-9]+$/p' | sort -t- -k2 -n | tail -1; }
          gcc=$(newest)
          if [ -z "$gcc" ]; then brew install gcc; gcc=$(newest); fi
          "$gcc" --version | sed -n 1p
          export CC="$gcc"
          failed=0
          cargo test -p presk-export-c --no-fail-fast || failed=1
          cargo test -p presk --test export_c --test export_scop --no-fail-fast || failed=1
          exit $failed
