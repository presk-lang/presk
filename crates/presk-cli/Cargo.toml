[package]
name = "presk"
description = "The Presk compiler: a language for neural networks with exact real semantics, compiled under a declared error budget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
# raw_value: `presk reprice` copies a recorded point's fields verbatim (0.8.0 step 1)
serde_json = { workspace = true, features = ["raw_value"] }
presk-syntax.workspace = true
presk-types.workspace = true
presk-core.workspace = true
presk-interp.workspace = true
presk-data.workspace = true
presk-train.workspace = true
presk-rt.workspace = true
presk-kernel.workspace = true
presk-realize.workspace = true
presk-cranelift.workspace = true
presk-serve.workspace = true
presk-export-pytorch.workspace = true
presk-export-c.workspace = true
presk-opt.workspace = true
presk-precision.workspace = true

[dev-dependencies]
insta.workspace = true

[[bin]]
name = "presk"
path = "src/main.rs"
