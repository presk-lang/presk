<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presk pipeline view</title>
<!--
  The pipeline view of one compilation (plan 0.13.0 step 3, D136): the
  stages of `presk explain` as columns, every element linked by an arrow to
  what it was made from, read off the provenance table that `explain.json`
  holds and that `presk explain --format html` inlines below. One file, no
  framework, no build step and nothing fetched: the page works offline.
  Written by presk-explain from crates/presk-explain/templates/explain.html.
  The formulas are the printer of the denotation's (plan 0.13.0 step 4,
  D137), typeset by KaTeX 0.19.0 (MIT), inlined with its fonts. The second
  tab, Network (plan 0.14.0 step 2, D142), draws the program as boxes and
  arrows at the positions `presk-diagram` computed, every box and arrow an
  element of the same table.
-->
<style>
:root {
  color-scheme: light dark;
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --line: #d9d6cf; --card: #ffffff;
  --lit: #fff4c2; --sel: #ffd84d; --dim: 0.22; --panel: #f3f1ec;
  --f64: #2f5d9e; --f32: #2b8a3e; --bf16: #d9730d; --int: #8e44ad; --none: #8a8780;
  --how-lower: #5f6f8f; --how-ad: #a03d6f; --how-opt: #7a4fc4; --how-fuse: #1f7a7a; --how-pass: #b9b5ac;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1a; --fg: #ecebe6; --muted: #a09e97; --line: #3a3936; --card: #252523;
    --lit: #4a4220; --sel: #8a6d00; --panel: #22221f;
    --f64: #7aa7e8; --f32: #6fcf7f; --bf16: #f0a050; --int: #c08ae0; --none: #8a8780;
    --how-lower: #9aa9c8; --how-ad: #e07aa8; --how-opt: #b495f0; --how-fuse: #5fc9c9; --how-pass: #5a5853;
  }
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1b1a; --fg: #ecebe6; --muted: #a09e97; --line: #3a3936; --card: #252523;
  --lit: #4a4220; --sel: #8a6d00; --panel: #22221f;
  --f64: #7aa7e8; --f32: #6fcf7f; --bf16: #f0a050; --int: #c08ae0; --none: #8a8780;
  --how-lower: #9aa9c8; --how-ad: #e07aa8; --how-opt: #b495f0; --how-fuse: #5fc9c9; --how-pass: #5a5853;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 10px 16px 6px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0 0 2px; font-weight: 600; }
header .sub { color: var(--muted); font-size: 12px; }
#bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
#bar button { font: inherit; padding: 2px 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 4px; cursor: pointer; }
#bar button:hover { border-color: var(--muted); }
#caption { flex: 1 1 300px; color: var(--fg); min-height: 1.3em; }
#caption b { font-weight: 600; }
#legend { display: flex; gap: 10px; color: var(--muted); font-size: 11px; flex-wrap: wrap; }
#legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-right: 4px; vertical-align: middle; background: var(--c); }
#main { display: flex; align-items: flex-start; }
#scroll { position: relative; overflow: auto; flex: 1 1 auto; height: calc(100vh - 92px); }
#cols { position: relative; display: flex; gap: 46px; padding: 10px 16px 40px; width: max-content; }
svg#arrows { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
svg#arrows path { fill: none; stroke-width: 1.3; opacity: 0.55; }
svg#arrows path.pass { stroke-dasharray: 3 3; }
svg#arrows path.lit { opacity: 0.95; stroke-width: 2.2; }
svg#arrows path.dim { opacity: 0.07; }
.col { width: 250px; flex: 0 0 auto; }
.col h2 { font-size: 12px; margin: 0 0 6px; font-weight: 600; position: sticky; top: 0; background: var(--bg); padding: 2px 0; z-index: 2; }
.col h2 .n { color: var(--muted); font-weight: 400; }
.col .note { color: var(--muted); font-size: 11px; margin: -2px 0 6px; }
.grp { border: 1px solid var(--line); border-radius: 5px; margin-bottom: 6px; background: var(--card); }
.grp > .gh { padding: 3px 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; font-weight: 600; font-size: 12px; }
.grp > .gh .c { color: var(--muted); font-weight: 400; }
.grp.open > .gh { border-bottom: 1px solid var(--line); }
.card { padding: 2px 6px; margin: 2px 3px; border-left: 3px solid var(--none); font: 11.5px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; cursor: pointer; border-radius: 2px; }
.card:hover { background: var(--panel); }
.card.lit, .grp.lit > .gh { background: var(--lit); }
.card.sel { background: var(--sel); }
.dimmed .card:not(.lit):not(.sel), .dimmed .grp:not(.lit) > .gh { opacity: var(--dim); }
.card .fold { color: var(--muted); font-style: italic; }
.card .ov { float: right; color: var(--muted); font-size: 10.5px; margin-left: 4px; }
.t-f64 { border-left-color: var(--f64); } .t-f32 { border-left-color: var(--f32); } .t-bf16 { border-left-color: var(--bf16); }
.t-int8, .t-int4 { border-left-color: var(--int); }
#panel { width: clamp(340px, 30vw, 640px); flex: 0 0 clamp(340px, 30vw, 640px); height: calc(100vh - 92px); overflow: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 10px 12px; font-size: 12px; }
#panel h3 { font-size: 13px; margin: 0 0 6px; word-break: break-all; }
#panel .stage { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
#panel pre { font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); padding: 5px; margin: 4px 0; max-height: 280px; overflow: auto; }
#panel table { border-collapse: collapse; width: 100%; margin: 4px 0; }
#panel td { border-top: 1px solid var(--line); padding: 2px 4px; vertical-align: top; }
#panel td:first-child { color: var(--muted); white-space: nowrap; }
#panel .math { border: 1px solid var(--line); background: var(--card); padding: 4px 6px; margin: 6px 0; overflow-x: auto; }
#panel .math .what { color: var(--muted); font-size: 11px; margin-top: 4px; }
#panel .math .katex-display { margin: 0.3em 0; }
#panel .math .katex { font-size: 0.9em; }
.card.m { white-space: normal; overflow: hidden; font-family: inherit; }
.card .katex { font-size: 0.92em; }
#panel .made { margin: 3px 0; }
#panel table.code td { font: 10.5px/1.3 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
#panel table.code td:first-child { text-align: right; }
#panel table.code i { color: var(--muted); }
#bench { position: fixed; right: 8px; bottom: 6px; background: var(--card); border: 1px solid var(--line); padding: 4px 8px; font-size: 11px; color: var(--muted); z-index: 9; }
#tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
#bar #tabs button { border: 0; border-radius: 0; background: var(--card); }
#bar #tabs button.on { background: var(--fg); color: var(--bg); }
.netonly { display: none; }
body.network .netonly { display: inline-block; }
body.network .pipeonly { display: none; }
#bar button.on:not(#tabs button) { border-color: var(--fg); font-weight: 600; }
#net { position: relative; overflow: auto; flex: 1 1 auto; height: calc(100vh - 92px); padding: 8px 16px 40px; }
#net svg { display: block; }
#net .frame { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
#net .frame.root { fill: none; stroke: none; }
#net .box > rect.b { fill: var(--panel); stroke-width: 1.4; }
#net .box.open > rect.b { fill: var(--card); }
#net .box .hd { cursor: pointer; }
#net .box .hd:hover > rect { fill: var(--lit); }
#net .box .hd > rect { fill: transparent; }
#net text { fill: var(--fg); font: 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
#net text.t { font-weight: 600; }
#net text.n { fill: var(--muted); font-size: 10px; }
#net .op > rect { fill: var(--card); stroke: #9a7b4f; }
#net .op.group > rect { fill: color-mix(in srgb, #f0b860 22%, var(--card)); }
#net .op.host > rect { stroke-dasharray: 2 2; fill: var(--panel); }
#net .param > rect { fill: color-mix(in srgb, var(--int) 10%, var(--card)); stroke: var(--int); }
#net .io > rect { fill: var(--card); stroke: var(--muted); }
#net .node { cursor: pointer; }
#net .nf { overflow: hidden; color: var(--fg); transform-origin: 0 0; white-space: nowrap; }
#net .nf .katex-display { margin: 0; text-align: left; }
#net .nf .katex { font-size: 0.9em; }
#net path.e { fill: none; opacity: 0.8; }
#net path.e.key { stroke-dasharray: 3 3; }
#net text.el { fill: var(--muted); font-size: 9.5px; }
#net.dimmed .node:not(.lit), #net.dimmed path.e:not(.lit) { opacity: 0.25; }
#net .node.lit > rect { stroke-width: 2.6; }
#net path.e.lit { opacity: 1; }
@media (max-width: 760px) { #panel { display: none; } #scroll, #net { height: auto; } }
</style>
<style>/*KATEX_CSS*/</style>
</head>
<body>
<header>
  <h1 id="title">Presk pipeline view</h1>
  <div class="sub" id="sub"></div>
</header>
<div id="bar">
  <span id="tabs"><button id="tab-pipeline" class="on" title="the stages as columns">Pipeline</button><button id="tab-network" title="the program as boxes and arrows">Network</button></span>
  <button id="prev" title="previous step (←)">◀</button>
  <button id="next" title="next step (→)">▶</button>
  <span id="caption"></span>
  <button id="add" title="add the current selection to the lesson in the address">add step</button>
  <button id="fold" class="pipeonly" title="fold every function to one card">fold all</button>
  <button id="unfold" class="pipeonly" title="open every function">open all</button>
  <button id="labels" class="netonly" title="every arrow's shape, type and bytes written on it">labels</button>
  <button id="keys" class="netonly" title="the random keys and their split_keys">keys</button>
  <button id="backward" class="netonly" title="the backward pass: the functions differentiation generated for it" hidden>backward</button>
  <button id="netreset" class="netonly" title="the default opening">default</button>
  <button id="math" title="the cards as formulas, or as text">∑ math</button>
  <button id="theme" title="light or dark">◐</button>
  <span id="legend"></span>
</div>
<div id="main">
  <div id="scroll"><div id="cols"></div><svg id="arrows"></svg></div>
  <div id="net" hidden><svg id="netsvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside id="panel"><p>Select an element: its origins and what it became light up through every stage. Hover for its facts. A function folds and opens by its header. <kbd>←</kbd> <kbd>→</kbd> step through the lesson in the address; <kbd>Esc</kbd> clears.</p></aside>
</div>
<div id="bench" hidden></div>
<script>/*KATEX_JS*/</script>
<script type="application/json" id="presk-data">/*PRESK_DATA*/null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("presk-data").textContent);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// ----- the model ------------------------------------------------------------
// An element is "stage:key". Its parents and children come from the links;
// its group is the function it belongs to, inherited from its children for
// the source and the elaborated program, which have none of their own.
const E = new Map();
const order = [];
for (const st of D.stages || []) {
  for (const e of st.elements) {
    const id = st.stage + ":" + e.key;
    E.set(id, { id, stage: st.stage, key: e.key, label: e.label, group: e.group || null, facts: e.facts || {}, ends: e.ends || null, parents: [], children: [], made: [] });
  }
  order.push(st);
}
for (const l of D.links || []) {
  const c = E.get(l.child);
  if (!c) continue;
  c.made.push(l);
  for (const p of l.parents) {
    const pe = E.get(p);
    if (!pe) continue;
    c.parents.push(p);
    pe.children.push(l.child);
  }
}
for (const st of [...order].reverse()) {
  for (const e of st.elements) {
    const x = E.get(st.stage + ":" + e.key);
    if (!x.group) {
      const c = x.children.map((k) => E.get(k)).find((y) => y && y.group);
      x.group = c ? c.group : (st.stage === "source" ? "source" : "program");
    }
  }
}
const isFn = (x) => ["core", "ad", "opt"].includes(x.stage) && !x.key.includes("/%");
const how = (x) => (x.made[0] ? x.made[0].how : null);

// A column is a decision taken: no column for differentiation when nothing
// was differentiated, none for the optimizer without --opt (the JSON has no
// such stage); an unchanged element is a pass-through, drawn as one arrow
// across its column, never as a card.
const hidden = (x) => isFn(x) || ((x.stage === "ad" || x.stage === "opt") && how(x) === "unchanged") || (x.stage === "ad" && !D.program.differentiated);
const columns = order.filter((st) => !(st.stage === "ad" && !D.program.differentiated));
const colIndex = new Map(columns.map((st, i) => [st.stage, i]));

// The shown elements an element's arrows start from: its parents, or theirs
// through a pass-through.
function shownParents(x, seen = new Set()) {
  const out = [];
  for (const p of x.parents) {
    if (seen.has(p)) continue;
    seen.add(p);
    const pe = E.get(p);
    if (!pe) continue;
    if (hidden(pe)) {
      // Dashed where it crosses a column that is drawn: a pass-through.
      for (const q of shownParents(pe, seen)) out.push({ id: q.id, pass: q.pass || colIndex.has(pe.stage) });
    } else out.push({ id: p, pass: false });
  }
  return out;
}

// ----- folding --------------------------------------------------------------
// The view opens at the function level in every column, with the functions
// of the traced sites open and their threads lit (the user's decision of
// 2026-10-17); the precision column lists its decisions and folds the rest.
const open = new Set();
// A traced site's shown element: where differentiation or the optimizer
// made it, else PSK-Core's, which every later stage passes through to.
const tracedAny = (D.traced || []).map((s) => ["ad:" + s, "opt:" + s, "core:" + s].find((k) => E.has(k) && !hidden(E.get(k))) || ["core:" + s, "ad:" + s].find((k) => E.has(k))).filter(Boolean);
for (const k of tracedAny) open.add(E.get(k).group);
let selection = new Set(tracedAny);
const followersOpen = new Set();

// ----- the mathematics (plan 0.13.0 step 4c) --------------------------------------
// Every formula is the printer of the denotation's, in the notation of the
// reference's chapter 3 (section 3.10), typeset when it is first shown and
// kept: a card's formula when it scrolls into view, the inspector's when an
// element is inspected.
const MACROS = { "\\code": "\\text{\\texttt{#1}}", "\\den": "\\llbracket #1 \\rrbracket" };
const texCache = new Map();
function tex(s, display) {
  const k = (display ? "D" : "I") + s;
  let h = texCache.get(k);
  if (h === undefined) {
    try { h = katex.renderToString(s, { displayMode: display, throwOnError: false, macros: MACROS, strict: "ignore" }); }
    catch (e) { h = `<code>${esc(s)}</code>`; }
    texCache.set(k, h);
  }
  return h;
}
function texNum(v) {
  if (v === 0 || !isFinite(v)) return String(v);
  const e = Math.floor(Math.log10(Math.abs(v)));
  if (e >= -2 && e < 4) return String(+v.toPrecision(3));
  const m = +(v / Math.pow(10, e)).toFixed(2);
  return m === 1 ? `10^{${e}}` : `${m} \\cdot 10^{${e}}`;
}
let mathOn = typeof katex !== "undefined";
// A card's formula: the elaborated program's, PSK-Core's and the stages
// after it; a source card keeps its text, its formula in the inspector.
const cardTex = (x) => (["elab", "core", "ad", "opt", "layout"].includes(x.stage) ? x.facts.tex || null : null);
const ovOf = new WeakMap();
let pendingDraw = 0;
const io = typeof IntersectionObserver !== "undefined" ? new IntersectionObserver((entries) => {
  let changed = false;
  for (const en of entries) {
    if (!en.isIntersecting) continue;
    const c = en.target;
    io.unobserve(c);
    const x = E.get(c.dataset.id);
    const t = x && mathOn ? cardTex(x) : null;
    if (!t) continue;
    c.innerHTML = (ovOf.get(c) || "") + tex(t, false);
    changed = true;
  }
  // A formula changes a card's height: the arrows follow.
  if (changed) { cancelAnimationFrame(pendingDraw); pendingDraw = requestAnimationFrame(() => { draw(); light(); }); }
}, { root: document.getElementById("scroll"), rootMargin: "300px" }) : null;

// ----- drawing ----------------------------------------------------------------
const cols = $("#cols");
const svg = $("#arrows");
const typeOf = (x) => x.facts.type || x.facts.dtype || null;
const HOW_COLOR = {
  defined: "--how-lower", instantiated: "--how-lower", typed: "--how-lower", lowered_fn: "--how-lower", lowered: "--how-lower",
  gradient: "--how-ad", generated: "--how-ad", primal: "--how-ad", adjoint: "--how-ad", accumulate: "--how-ad", zero: "--how-ad", seed: "--how-ad", plumbing: "--how-pass",
  rewritten: "--how-opt", introduced: "--how-opt", unchanged: "--how-pass",
  fused: "--how-fuse", alone: "--how-fuse", site: "--how-fuse", parameter: "--how-fuse",
};
const PRECISION_ON = colIndex.has("precision") ? colIndex.get("precision") : 99;
function color(child) {
  const i = colIndex.get(child.stage);
  const t = typeOf(child);
  if (i >= PRECISION_ON && t) return `var(--${t.startsWith("int") ? "int" : t})`;
  return `var(${HOW_COLOR[how(child)] || "--none"})`;
}

let cardOf = new Map(); // shown element -> its card, or its group's header
function render() {
  const t0 = performance.now();
  cols.textContent = "";
  cardOf = new Map();
  for (const st of columns) {
    const col = document.createElement("div");
    col.className = "col";
    const shown = st.elements.map((e) => E.get(st.stage + ":" + e.key)).filter((x) => !hidden(x));
    col.innerHTML = `<h2>${st.section ? "§" + esc(st.section) + " " : ""}${esc(st.title)} <span class="n">${shown.length}</span></h2>`;
    if (st.stage === "opt") col.insertAdjacentHTML("beforeend", `<div class="note">only what the optimizer changed; an unchanged let passes through</div>`);
    if (st.stage === "ad") col.insertAdjacentHTML("beforeend", `<div class="note">what differentiation made; the functions it left pass through</div>`);
    const groups = new Map();
    for (const x of shown) {
      if (!groups.has(x.group)) groups.set(x.group, []);
      groups.get(x.group).push(x);
    }
    for (const [g, xs] of groups) {
      const box = document.createElement("div");
      box.className = "grp" + (open.has(g) ? " open" : "");
      box.dataset.group = g;
      const gh = document.createElement("div");
      gh.className = "gh";
      gh.innerHTML = `<span>${esc(g)}</span><span class="c">${xs.length}</span>`;
      gh.onclick = () => toggle(g);
      box.appendChild(gh);
      if (open.has(g)) {
        let list = xs;
        let folded = [];
        if (st.stage === "precision" && !followersOpen.has(g)) {
          list = xs.filter((x) => (x.made[0] && x.made[0].role) !== "follows" && (x.made[0] && x.made[0].role) !== "carried");
          folded = xs.filter((x) => !list.includes(x));
        }
        for (const x of list) box.appendChild(card(x));
        if (folded.length) {
          const f = document.createElement("div");
          f.className = "card";
          f.innerHTML = `<span class="fold">+${folded.length} that follow or are carried</span>`;
          f.onclick = () => { followersOpen.add(g); render(); };
          box.appendChild(f);
          for (const x of folded) cardOf.set(x.id, f);
        }
      } else for (const x of xs) cardOf.set(x.id, gh);
      col.appendChild(box);
    }
    cols.appendChild(col);
  }
  draw();
  light();
  return performance.now() - t0;
}

function card(x) {
  const c = document.createElement("div");
  const t = typeOf(x);
  c.className = "card" + (t ? " t-" + t : "");
  c.dataset.id = x.id;
  let text = x.label;
  if (x.stage === "kernel") text = text.replace(/^kernel /, "");
  const ov = x.facts.measured_us != null ? `<span class="ov">${x.facts.measured_us.toFixed(2)} µs</span>` : x.facts.predicted_us != null ? `<span class="ov">${x.facts.predicted_us.toFixed(3)} µs pred.</span>` : "";
  c.innerHTML = ov + esc(text);
  const formula = mathOn ? cardTex(x) : null;
  if (formula) {
    c.classList.add("m");
    c.title = x.label;
    ovOf.set(c, ov);
    const done = texCache.get("I" + formula);
    if (done !== undefined) c.innerHTML = ov + done;
    else if (io) io.observe(c);
    else c.innerHTML = ov + tex(formula, false);
  }
  c.onclick = (ev) => { select(x.id, ev.shiftKey); ev.stopPropagation(); };
  c.onmouseenter = () => inspect(x);
  cardOf.set(x.id, c);
  return c;
}

// One SVG for every arrow, drawn between the cards the links name, bundled
// where a fold puts several elements in one card.
let paths = [];
function draw() {
  const host = $("#scroll");
  const base = cols.getBoundingClientRect();
  svg.setAttribute("width", cols.scrollWidth);
  svg.setAttribute("height", cols.scrollHeight);
  svg.textContent = "";
  paths = [];
  const seen = new Map();
  for (const x of E.values()) {
    if (hidden(x)) continue;
    const to = cardOf.get(x.id);
    if (!to) continue;
    for (const p of shownParents(x)) {
      const from = cardOf.get(p.id);
      if (!from || from === to) continue;
      const key = colIndex.get(E.get(p.id).stage) + "|" + colIndex.get(x.stage) + "|" + (from.dataset.id || from.parentNode.dataset.group) + "|" + (to.dataset.id || to.parentNode.dataset.group);
      let a = seen.get(key);

  for (const [i, g] of netNodes) {
    const n = nodeOf(i);
    g.classList.toggle("lit", any && (lit.has(n.element) || (n.function && lit.has(n.function))));
  }
  for (const { el: p, e } of netEdges) p.classList.toggle("lit", any && lit.has(e.site));
}
// A node's elements: its own, and a box's callee's function.
const elementsOf = (n) => [n.element, ...(n.function && n.function !== n.element ? [n.function] : [])].filter((k) => E.has(k));
// A click selects in the columns and shows them; with Shift, it stays here.
function pickNode(n, stay) {
  const t0 = performance.now();
  selection = new Set(elementsOf(n));
  if (stay) {
    lightNet();
    inspectNode(n);
    return performance.now() - t0;
  }
  for (const k of selection) open.add(E.get(k).group);
  showTab("pipeline");
  const first = [...selection][0];
  if (first) {
    inspect(E.get(first));
    const c = cardOf.get(first);
    if (c) c.scrollIntoView({ block: "center", inline: "center" });
  }
  return performance.now() - t0;
}
const fmt = (x) => (x == null ? "–" : Math.abs(x) >= 1e5 ? x.toExponential(3) : String(+x.toPrecision(4)));
function inspectNode(n) {
  const KIND = { root: "the entry", call: "a call", stack: "a stack: one box for its layers", group: "a fusion group: one loop nest", op: "a primitive in a loop nest of its own", host: "a primitive the host computes", param: "a parameter", input: "an argument", output: "the result" };
  let h = `<div class="stage">network · ${esc(KIND[n.kind] || n.kind)}</div><h3>${esc(n.title)}</h3><table>`;
  const row = (k, v) => { if (v != null && v !== "") h += `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`; };
  row("element", n.element);
  row("function", n.function !== n.element ? n.function : null);
  row("instance", n.instance);
  row("parameters", n.path === "" ? "θ" : n.path ? "θ." + n.path : null);
  if (n.params) row("their count", `${n.params.count} (${n.params.bytes} bytes, ${n.params.types.join(", ")})${n.runs > 1 ? ", a layer's" : ""}`);
  if (n.work != null) row("work W", fmt(n.work) + (n.runs > 1 ? ` over ${n.runs} runs` : ""));
  if (n.bytes != null) row("bytes Q", fmt(n.bytes) + (n.runs > 1 ? ` over ${n.runs} runs` : ""));
  if (n.work && n.bytes) row("intensity W/Q", fmt(n.work / n.bytes));
  if (n.generated) row("generated", `.${n.generated.kind} of ${n.generated.of}`);
  if (n.members && n.members.length > 1) row("members", n.members.join(", "));
  h += "</table>";
  if (mathOn && n.tex) h += `<div class="math"><div class="what">${["call", "stack", "root"].includes(n.kind) ? "its function's display (the reference, section 3.10)" : "its equation (section 3.10)"}</div>${tex(n.tex, true)}${n.sum ? `<div class="what">the sum it computes</div>${tex(n.sum, true)}<div class="what">its terms added in the order</div>${tex(n.order, true)}` : ""}</div>`;
  else if (n.text) h += `<pre>${esc(n.text)}</pre>`;
  // A group's members, each with its equation: what never reaches memory.
  if (n.members && n.members.length > 1) for (const m of n.members.slice(1)) { const x = E.get(m); if (x && x.facts.tex && mathOn) h += `<div class="math"><div class="what">${esc(m)}, inside the nest</div>${tex(x.facts.tex, false)}</div>`; }
  const x = E.get(n.element);
  if (x) h += `<hr>` + inspectHtml(x);
  $("#panel").innerHTML = h;
}
function inspectEdge(e) {
  let h = `<div class="stage">network · an arrow: the value of a site</div><h3>${esc(e.site)}</h3><table>`;
  for (const [k, v] of [["its type", e.ty], ["at the dimensions", e.at], ["realized", e.dtype], ["elements", e.elems], ["bytes", e.bytes]]) h += `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`;
  h += "</table>";
  const x = E.get(e.site);
  if (x) h += `<hr>` + inspectHtml(x);
  $("#panel").innerHTML = h;
}
function showTab(t) {
  tab = t;
  document.body.classList.toggle("network", t === "network");
  $("#tab-pipeline").classList.toggle("on", t === "pipeline");
  $("#tab-network").classList.toggle("on", t === "network");
  $("#scroll").hidden = t !== "pipeline";
  net.hidden = t !== "network";
  if (t === "network") drawNet(); else render();
}
$("#tab-pipeline").onclick = () => showTab("pipeline");
$("#tab-network").onclick = () => showTab("network");
const toggleBtn = (id, f) => { $(id).onclick = () => { f(); $(id).classList.toggle("on"); drawNet(); }; };
toggleBtn("#labels", () => { labelsOn = !labelsOn; });
toggleBtn("#keys", () => { keysOn = !keysOn; });
toggleBtn("#backward", () => { backwardOn = !backwardOn; });
$("#netreset").onclick = () => { netPath = N.views[N.default].open.slice(); drawNet(); };
if (hasBackward) $("#backward").hidden = false;
if (!N) $("#tab-network").disabled = true;
net.addEventListener("click", () => { selection = new Set(); lightNet(); });

// ----- the header and the legend --------------------------------------------------
const P = D.program || {};
$("#title").textContent = (D.document && D.document.title ? D.document.title.replace(/`/g, "") : "Presk pipeline view");
document.title = "Pipeline · " + (P.entry || "");
$("#sub").textContent = `presk ${D.compiler} · ${P.file} · entry ${P.entry}` + (P.dims && P.dims.length ? " · " + P.dims.map((d) => d[0] + " = " + d[1]).join(", ") : "") + ` · ${P.realization}` + (P.opt ? " · --opt" : " · optimizer not requested") + (P.planned ? " · planned" : " · default layouts, no profile") + (P.differentiated ? "" : " · nothing differentiated");
$("#legend").innerHTML = [["lowering", "--how-lower"], ["differentiation", "--how-ad"], ["optimizer", "--how-opt"], ["fusion and sites", "--how-fuse"], ["pass-through", "--how-pass"], ["f64", "--f64"], ["f32", "--f32"], ["bf16", "--bf16"]].map(([n, c]) => `<span style="--c: var(${c})">${n}</span>`).join("");

// ----- start, and the bench of statement P3 -----------------------------------------
if (D.format !== 2) {
  document.body.innerHTML = `<p style="padding:16px">This page reads explain.json of format 2; this one is format ${esc(D.format)}.</p>`;
} else {
  const first = render();
  if (L.lesson.length) go(L.step);
  // `#tab=network` opens on the diagram, `net=` with its boxes opened (their
  // ids, outermost first), and `labels`, `keys`, `backward` as their
  // buttons set them.
  const q0 = new URLSearchParams(location.hash.slice(1));
  if (N && q0.get("net")) netPath = q0.get("net").split(",").map(Number).filter((i) => i < N.nodes.length);
  for (const [k, set] of [["labels", () => { labelsOn = true; }], ["keys", () => { keysOn = true; }], ["backward", () => { backwardOn = true; }]]) if (q0.has(k)) { set(); $("#" + k).classList.add("on"); }
  // `theme=light|dark`; `plain`: nothing selected.
  if (["light", "dark"].includes(q0.get("theme"))) document.documentElement.dataset.theme = q0.get("theme");
  if (q0.has("plain")) selection = new Set();
  if (N && q0.get("tab") === "network") showTab("network");
  else if (q0.has("plain")) light();
  if (L.bench) {
    // Statement P3: a select and a collapse redraw under 200 ms. Every
    // traced site selected, every function folded and opened, by the page's
    // own clock.
    const times = { first };
    const sel = [];
    for (const k of E.keys()) if (!hidden(E.get(k)) && sel.length < 200) sel.push(select(k, false));
    const groups = [...new Set([...E.values()].map((x) => x.group))];
    const tog = [];
    for (const g of groups) { tog.push(toggle(g)); tog.push(toggle(g)); }
    const max = (a) => a.length ? Math.max(...a) : 0;
    times.select = max(sel);
    times.collapse = max(tog);
    const el = $("#bench");
    el.hidden = false;
    el.textContent = `P3 bench: first draw ${times.first.toFixed(0)} ms; select ${sel.length}, at most ${times.select.toFixed(1)} ms; fold or open ${tog.length}, at most ${times.collapse.toFixed(1)} ms; ${E.size} elements, ${paths.length} arrows drawn`;
    if (N) {
      // Statement N5: the diagram's open, fold and select under P3's bound;
      // and N1's second half: a click on a box of the default opening
      // selects its elements in the columns, which light.
      showTab("network");
      const opens = [], picks = [];
      for (const v of N.views) { netPath = v.open.slice(); opens.push(drawNet()); }
      netPath = N.views[N.default].open.slice();
      opens.push(drawNet());
      for (const i of netNodes.keys()) picks.push(pickNode(nodeOf(i), true));
      const boxes = N.views[N.default].rects.map((r) => nodeOf(r[0])).filter((n) => ["call", "stack"].includes(n.kind));
      const bad = [];
      for (const n of boxes) {
        showTab("network");
        pickNode(n, false);
        for (const k of elementsOf(n)) {
          const x = E.get(k);
          const shown = hidden(x) ? shownParents(x).map((p) => p.id) : [k];
          const ok = shown.some((id) => { const c = cardOf.get(id); return c && (c.classList.contains("lit") || c.classList.contains("sel") || (c.parentNode && c.parentNode.classList.contains("lit"))); });
          if (!ok) bad.push(`${n.title}: ${k}`);
        }
      }
      showTab("pipeline");
      el.textContent += ` · N5: ${opens.length} openings drawn, at most ${max(opens).toFixed(1)} ms; ${picks.length} selects, at most ${max(picks).toFixed(1)} ms · N1: ${boxes.length} boxes clicked, ${bad.length ? "NOT LIT: " + bad.join("; ") : "every one lit in the columns"}`;
    }
    document.title = el.textContent;
  }
}
